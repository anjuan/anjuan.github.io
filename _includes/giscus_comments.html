{% comment %}
  giscus comments, backed by GitHub Discussions on site.giscus.repo.
  Settings live under `giscus:` in _config.yml. Turn comments off for a single
  post with `comments: false` in its front matter.
{% endcomment %}
<section class="post-comments" id="comments">
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.giscus.repo }}"
          data-repo-id="{{ site.giscus.repo_id }}"
          data-category="{{ site.giscus.category }}"
          data-category-id="{{ site.giscus.category_id }}"
          data-mapping="{{ site.giscus.mapping | default: 'pathname' }}"
          data-strict="{{ site.giscus.strict | default: '1' }}"
          data-reactions-enabled="{{ site.giscus.reactions_enabled | default: '1' }}"
          data-emit-metadata="0"
          data-input-position="{{ site.giscus.input_position | default: 'bottom' }}"
          data-theme="{{ site.giscus.theme | default: 'light' }}"
          data-lang="{{ site.giscus.lang | default: 'en' }}"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
  <noscript>Please enable JavaScript to view the comments, or join the conversation on <a href="https://github.com/{{ site.giscus.repo }}/discussions">GitHub Discussions</a>.</noscript>
</section>
