name: Post images

# Runs script/post_images.py whenever a post or image lands on master, so each
# new post gets its `image:` line and blog-list thumbnail without anyone
# running the script by hand. If the script changes anything, this commits
# the result and asks GitHub Pages to rebuild, because commits pushed with the
# workflow's GITHUB_TOKEN don't trigger a Pages build on their own.
#
# It can also be run by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [master]
    paths:
      - "_posts/**"
      - "images/**"
      - "_config.yml"
      - "script/post_images.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Run one at a time, so a post and its image uploaded back to back don't race.
concurrency:
  group: post-images
  cancel-in-progress: false

jobs:
  post-images:
    runs-on: ubuntu-latest
    steps:
      # Check out the current tip of master, not the commit that triggered the
      # run, so a queued run sees anything an earlier run already committed.
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Add image lines and thumbnails
        run: python script/post_images.py

      - name: Commit and push any changes
        id: commit
        run: |
          git add _posts images/thumbs
          if git diff --cached --quiet; then
            echo "Every post already has its image and thumbnail."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898323+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add post images and thumbnails"
          git pull --rebase origin master
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
