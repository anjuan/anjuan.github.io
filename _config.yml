# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Anjuan Simmons
jobtitle: "Technology Translator"
email: 
description: > # this means to ignore newlines until "baseurl:"
  I'm a Technology Translator. Welcome to my site.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://AnjuanSimmons.com" # the base hostname & protocol for your site
twitter_username: anjuan
bluesky_handle: anjuansimmons.com
github_username:  anjuan

# Comments (giscus, backed by GitHub Discussions on this repo)
# Comments appear on every post. Turn them off for one post by adding
# `comments: false` to its front matter. Leave repo_id blank to turn them off
# site-wide. IDs come from https://giscus.app (or the GitHub API).
giscus:
    repo: "anjuan/anjuan.github.io"
    repo_id: "MDEwOlJlcG9zaXRvcnkxMDA5OTcwNTk="
    category: "Announcements"
    category_id: "DIC_kwDOBgUXw84COtq_"
    mapping: "pathname"       # one discussion per post URL
    strict: "1"
    reactions_enabled: "1"
    input_position: "bottom"
    theme: "light"            # the site has no dark mode
    lang: "en"

# Build settings
markdown: kramdown

# Other options
permalink: blog/:year/:month/:title/
excerpt_separator: "<!--more-->"

# Blog list pagination (blog/index.html). Page 1 is /blog/, then /blog/page2/, etc.
paginate: 10
paginate_path: "/blog/page:num/"

# Image shown in the blog list for posts without an `image:` front matter line.
default_post_image: "/images/Anjuan-May-2020-FINAL.jpg"

# Google Analytics
google_analytics: UA-112266652-1

# SEO stuff
google_author: "https://plus.google.com/u/0/+AnjuanSimmons"

plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - html-proofer


# Exclude from processing.
